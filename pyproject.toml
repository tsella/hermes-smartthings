[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-smartthings"
version = "0.1.0"
description = "Samsung SmartThings integration for Hermes Agent"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Tom Sella"}]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
]

[project.urls]
Repository = "https://github.com/tsella/hermes-smartthings"
Documentation = "https://developer.smartthings.com/docs/api/public"

[tool.setuptools.packages.find]
where = ["."]
include = ["smartthings_core"]
